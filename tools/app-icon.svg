<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Fly Easy home-screen icon. Source for images/app/*.png
       (rebuild with: sh tools/make_app_icons.sh).
       Full-bleed square: iOS rounds the corners itself, and the logo
       stays inside the 80% "maskable" safe circle for Android. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="1" x2="0.85" y2="0">
      <stop offset="0" stop-color="#FBFDFF"/>
      <stop offset="0.45" stop-color="#E6F4FC"/>
      <stop offset="1" stop-color="#BFE2F6"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.74" cy="0.26" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx="0.2" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#FFF6E8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF6E8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="1024" fill="url(#haze)"/>
  <rect width="1024" height="1024" fill="url(#sun)"/>

  <!-- soft clouds, same shapes as the logo's -->
  <g fill="#FFFFFF" opacity="0.9" transform="translate(96 212) scale(1.55)">
    <ellipse cx="40" cy="23" rx="26" ry="18"/>
    <ellipse cx="70" cy="10" rx="30" ry="22"/>
    <ellipse cx="103" cy="22" rx="24" ry="17"/>
    <rect x="20" y="20" width="105" height="26" rx="13"/>
  </g>
  <g fill="#FFFFFF" opacity="0.8" transform="translate(690 772) scale(1.7)">
    <ellipse cx="13" cy="13" rx="16" ry="11"/>
    <ellipse cx="30" cy="3" rx="19" ry="14"/>
    <ellipse cx="48" cy="12" rx="15" ry="10"/>
    <rect x="0" y="10" width="65" height="16" rx="8"/>
  </g>

  <!-- the Fly Easy mark: two contrails and the ascending jet -->
  <g transform="translate(21 43) scale(2)">
    <path d="M110,340 C160,300 230,280 300,290" stroke="#A9D6F1" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M90,300 C150,255 235,232 320,245" stroke="#4FA8DC" stroke-width="18" fill="none" stroke-linecap="round"/>
    <g transform="translate(300,230) rotate(-15) scale(9) translate(-11.5,-12)">
      <path d="M21,16V14L13,9V3.5C13,2.67,12.33,2,11.5,2C10.67,2,10,2.67,10,3.5V9L2,14V16L10,13.5V19L7.5,20.5V22L11.5,21L15.5,22V20.5L13,19V13.5L21,16Z" fill="#1B6FA8"/>
    </g>
  </g>
</svg>
